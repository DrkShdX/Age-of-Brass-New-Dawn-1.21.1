	[shieldReactions.recharge]
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 1
		# Range: 0 ~ 1
		enabled = 1
		#Reaction control. 100% retains the default effect; 0 disables this component.
		# Default: 100
